#
# Build e teste. O gate de conformidade vive no workflow `compliance.yml`.
# O job `core` é o gate obrigatório e não tem dependência de sistema — ele roda
# em qualquer runner. O job `client` compila SDL3 e pode precisar de ajuste na
# lista de pacotes conforme a imagem do runner.
name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: núcleo + testes (sem GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configurar
        run: cmake --preset headless
      - name: Compilar
        run: cmake --build --preset headless
      - name: Testar
        run: ctest --preset headless

  client:
    name: cliente (SDL3)
    runs-on: ubuntu-latest
    # Não-bloqueante: compila SDL3 do fonte e depende de pacotes de sistema.
    # O gate obrigatório é o job `core` (sem dependência de sistema) +
    # `compliance`. Job vermelho que não bloqueia é job que apodrece sem
    # ninguém ver — por isso este não é o único gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema para SDL3
        # Lista mínima para o configure do SDL3 (3.4.18) passar. X11 vem ligado
        # por padrão e `CheckX11` (cmake/sdlchecks.cmake) aborta com
        # `SDL_missing_dependency` quando uma extensão habilitada não tem
        # header+lib. Exigidas: XCURSOR (libxcursor-dev), XDBE (libx11-dev),
        # XINPUT (libxi-dev), XFIXES (libxfixes-dev), XSYNC e XSHAPE
        # (libxext-dev), XRANDR (libxrandr-dev), XSCRNSAVER (libxss-dev)
        # e XTEST (libxtst-dev) — as duas últimas também são o que faz a
        # captura relativa de mouse funcionar de verdade no X11.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev
      - name: Configurar (SDL3 via FetchContent)
        run: cmake --preset ci
      - name: Compilar
        run: cmake --build --preset ci
      - name: Testar
        run: ctest --preset ci
      - name: Critério do M0 sem GPU
        run: ./build/ci/bin/mdc-client --headless --seconds=600
